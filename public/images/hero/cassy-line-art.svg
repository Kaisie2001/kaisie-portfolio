  <title id="title">Cassy — short bob, continuous side-profile line art</title>
  <desc id="description">Based only on the supplied side-profile drawing. No hat, eyes, fill, filters or embedded image. One continuous outer contour and three auxiliary curves. Draw in ascending data-draw-order; each path has normalized length 1000.</desc>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Robotaxi Rain Mode — Interactive Demo</title>
  <style>
    :root {
      --teal: #00a8b5;
      --teal-dark: #008f9a;
      --teal-light: #e6f7f8;
      --green: #34a853;
      --green-light: #e8f6ec;
      --green-border: #b8e6c4;
      --red: #e53935;
      --red-light: #fdecea;
      --orange: #f5a623;
      --orange-light: #fff4e0;
      --blue-info: #e8f4fd;
      --blue-info-text: #1a6fb5;
      --text: #1c1c1e;
      --text-secondary: #8e8e93;
      --text-tertiary: #aeaeb2;
      --bg-page: #f0f2f5;
      --sheet: #ffffff;
      --phone-frame: #1a1a1a;
      --phone-bezel: #0d0d0d;
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
      --shadow-soft: 0 4px 16px rgba(0, 0, 0, 0.08);
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      --phone-w: 260px;
      --phone-h: 563px;
      --screen-radius: 36px;
      --island-w: 84px;
      --island-h: 22px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg-page);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Page header ── */
    .page-header {
      text-align: center;
      padding: 40px 24px 28px;
    }
    .page-header h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    .page-header p {
      font-size: 15px;
      color: var(--text-secondary);
      max-width: 560px;
      margin: 0 auto 20px;
      line-height: 1.5;
    }
    .flow-hint {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--sheet);
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 13px;
      color: var(--text-secondary);
      box-shadow: var(--shadow-soft);
    }
    .flow-hint span { color: var(--teal); font-weight: 600; }

    /* ── Grid layout ── */
    .demo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 32px 24px;
      max-width: 960px;
      margin: 0 auto;
      padding: 0 24px 60px;
    }
    @media (max-width: 900px) {
      .demo-grid { grid-template-columns: repeat(2, 1fr); max-width: 640px; }
    }
    @media (max-width: 580px) {
      .demo-grid { grid-template-columns: 1fr; max-width: 320px; }
    }

    .phone-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.2s ease;
      user-select: none;
    }
    .phone-slot .btn-primary,
    .phone-slot .btn-link,
    .phone-slot .pickup-card,
    .phone-slot .back-btn { cursor: pointer; }
    .phone-slot:hover { transform: translateY(-4px); }
    .phone-slot:focus-visible { outline: 2px solid var(--teal); outline-offset: 6px; border-radius: 12px; }

    .phone-caption {
      margin-top: 14px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      text-align: center;
    }
    .phone-caption .num {
      color: var(--teal);
      margin-right: 4px;
    }

    /* ── Phone shell ── */
    .phone {
      width: var(--phone-w);
      height: var(--phone-h);
      background: var(--phone-frame);
      border-radius: 44px;
      padding: 10px;
      box-shadow: var(--shadow), inset 0 0 0 1px rgba(255,255,255,0.06);
      position: relative;
      flex-shrink: 0;
    }
    .phone-screen {
      width: 100%;
      height: 100%;
      border-radius: var(--screen-radius);
      overflow: hidden;
      position: relative;
      background: #e8ecf0;
    }

    /* Status bar */
    .status-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 44px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 22px 6px;
      z-index: 20;
      pointer-events: none;
    }
    .status-bar .time {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }
    .status-bar .icons {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .status-bar .icons svg { display: block; }

    /* Dynamic Island */
    .dynamic-island {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: var(--island-w);
      height: var(--island-h);
      background: #000;
      border-radius: 20px;
      z-index: 25;
    }

    /* Home indicator */
    .home-indicator {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 4px;
      background: rgba(0,0,0,0.25);
      border-radius: 2px;
      z-index: 20;
    }

    /* Map layer */
    .map-layer {
      position: absolute;
      inset: 0;
      z-index: 1;
    }
    .map-layer.dimmed::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.35);
      z-index: 2;
    }

    /* Top chrome */
    .top-chrome {
      position: absolute;
      top: 48px;
      left: 0; right: 0;
      padding: 0 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 15;
      pointer-events: none;
    }
    .rain-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--teal);
      color: #fff;
      font-size: 10px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 20px;
      box-shadow: 0 2px 8px rgba(0,168,181,0.35);
    }
    .rain-badge svg { flex-shrink: 0; }
    .top-actions {
      display: flex;
      gap: 6px;
    }
    .circle-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }

    /* Bottom sheet */
    .bottom-sheet {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: var(--sheet);
      border-radius: 18px 18px 0 0;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.08);
      z-index: 10;
      padding: 8px 14px 16px;
      max-height: 72%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .bottom-sheet::-webkit-scrollbar { width: 0; }
    .sheet-handle {
      width: 32px;
      height: 4px;
      background: #d1d1d6;
      border-radius: 2px;
      margin: 0 auto 10px;
    }
    .sheet-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 3px;
    }
    .sheet-subtitle {
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 10px;
      line-height: 1.35;
    }

    /* Form rows */
    .field-label {
      font-size: 10px;
      color: var(--text-secondary);
      margin-bottom: 2px;
    }
    .field-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .field-icon { flex-shrink: 0; }
    .field-value {
      font-size: 13px;
      font-weight: 500;
    }
    .field-input {
      flex: 1;
      font-size: 13px;
      color: var(--text-tertiary);
    }
    .hint-row {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

  /* Back button */
    .back-btn {
      width: 28px;
      height: 28px;
      border: none;
      background: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      padding: 0;
      border-radius: 50%;
    }
    .back-btn:hover { background: #f2f2f7; }

    /* Buttons */
    .btn-primary {
      width: 100%;
      background: var(--teal);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      font-family: var(--font);
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      letter-spacing: -0.2px;
    }
    .btn-primary:hover { background: var(--teal-dark); }
    .btn-primary:active { transform: scale(0.98); }

    .btn-link {
      display: block;
      text-align: center;
      margin-top: 8px;
      font-size: 12px;
      color: var(--text-secondary);
      background: none;
      border: none;
      font-family: var(--font);
      cursor: pointer;
      width: 100%;
    }
    .btn-link:hover { color: var(--teal); }

    /* Banners */
    .banner-info {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      background: var(--blue-info);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 10px;
      color: var(--blue-info-text);
      line-height: 1.4;
      margin-bottom: 10px;
    }
    .banner-info svg { flex-shrink: 0; margin-top: 1px; }
    .banner-valid {
      display: flex;
      align-items: center;
      gap: 7px;
      background: var(--green-light);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 10px;
      color: var(--green);
      font-weight: 500;
      margin-bottom: 10px;
    }
    .banner-note {
      display: flex;
      align-items: flex-start;
      gap: 5px;
      font-size: 9px;
      color: var(--text-secondary);
      margin-bottom: 10px;
      line-height: 1.4;
    }

    /* Metric grid */
    .metric-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-bottom: 8px;
    }
    .metric-card {
      background: #f8f9fa;
      border-radius: 10px;
      padding: 8px;
      border: 1px solid #eee;
    }
    .metric-card .metric-icon { margin-bottom: 4px; }
    .metric-card .metric-text {
      font-size: 9px;
      line-height: 1.35;
      color: var(--text);
    }
    .metric-card .metric-text.orange { color: var(--orange); font-weight: 500; }

    /* Pickup options */
    .pickup-cards { display: flex; flex-direction: column; gap: 7px; margin-bottom: 10px; }
    .pickup-card {
      border: 1.5px solid #e5e5ea;
      border-radius: 12px;
      padding: 9px 10px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      position: relative;
    }
    .pickup-card:hover { border-color: #c7c7cc; }
    .pickup-card.selected {
      border-color: var(--green);
      background: var(--green-light);
    }
    .pickup-card.selected-red { border-color: var(--red); background: var(--red-light); }
    .pickup-card.selected-orange { border-color: var(--orange); background: var(--orange-light); }
    .pickup-card-header {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 5px;
    }
    .pickup-card-name { font-size: 12px; font-weight: 600; }
    .pickup-badge {
      position: absolute;
      top: 8px; right: 8px;
      font-size: 7px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 2px 5px;
      border-radius: 4px;
      background: var(--green);
      color: #fff;
    }
    .pickup-stats {
      display: flex;
      gap: 10px;
      font-size: 10px;
      margin-bottom: 3px;
    }
    .pickup-stats .stat-label { color: var(--text-secondary); }
    .pickup-stats .stat-val { font-weight: 600; }
    .pickup-stats .stat-val.highlight { color: var(--teal); }
    .pickup-note {
      font-size: 9px;
      color: var(--text-secondary);
    }
    .pickup-note.green { color: var(--green); }

    /* Detail rows */
    .detail-list { margin-bottom: 8px; }
    .detail-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 10px;
      line-height: 1.4;
      margin-bottom: 6px;
    }
    .detail-row .detail-icon { flex-shrink: 0; margin-top: 1px; }
    .detail-divider {
      height: 1px;
      background: #e5e5ea;
      margin: 6px 0;
    }

    /* Status cards row */
    .status-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }
    .status-card {
      background: #f8f9fa;
      border-radius: 10px;
      padding: 7px 5px;
      text-align: center;
      border: 1px solid #eee;
    }
    .status-card .sc-icon { margin-bottom: 3px; display: flex; justify-content: center; }
    .status-card .sc-text { font-size: 8px; line-height: 1.3; color: var(--text); }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    /* Map legend */
    .map-legend {
      position: absolute;
      top: 48px;
      right: 8px;
      background: rgba(255,255,255,0.92);
      border-radius: 8px;
      padding: 5px 7px;
      font-size: 7px;
      z-index: 12;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 3px;
    }
    .legend-item:last-child { margin-bottom: 0; }
    .legend-line { width: 18px; height: 2px; border-radius: 1px; }
    .legend-line.covered { background: var(--green); }
    .legend-line.exposed {
      background: repeating-linear-gradient(90deg, var(--green) 0 3px, transparent 3px 6px);
      opacity: 0.5;
    }

    /* Map pin labels */
    .map-pin-label {
      position: absolute;
      z-index: 11;
      font-size: 7px;
      font-weight: 600;
      white-space: nowrap;
      text-align: center;
      pointer-events: none;
    }
    .pin-label-box {
      background: #fff;
      border-radius: 6px;
      padding: 2px 5px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      line-height: 1.2;
    }
    .pin-label-box .pin-name { font-weight: 700; }
    .pin-label-box .pin-dist { color: var(--text-secondary); font-weight: 500; }

    /* Focus modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(6px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s, visibility 0.25s;
    }
    .modal-overlay.open {
      opacity: 1;
      visibility: visible;
    }
    .modal-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: scale(0.92);
      transition: transform 0.25s;
    }
    .modal-overlay.open .modal-content { transform: scale(1); }
    .modal-content .phone {
      --phone-w: 320px;
      --phone-h: 692px;
      --screen-radius: 44px;
      --island-w: 104px;
      --island-h: 28px;
    }
    .modal-close {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      border: none;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .modal-close:hover { background: rgba(255,255,255,0.25); }
    .modal-caption {
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      margin-top: 16px;
    }
    .modal-nav {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }
    .modal-nav button {
      background: rgba(255,255,255,0.15);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 13px;
      font-family: var(--font);
      cursor: pointer;
      transition: background 0.15s;
    }
    .modal-nav button:hover { background: rgba(255,255,255,0.25); }
    .modal-nav button:disabled { opacity: 0.35; cursor: default; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--text);
      color: #fff;
      padding: 12px 24px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 500;
      z-index: 2000;
      opacity: 0;
      transition: transform 0.3s, opacity 0.3s;
      pointer-events: none;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Screen highlight pulse when navigated */
    @keyframes highlight-pulse {
      0% { box-shadow: var(--shadow), 0 0 0 0 rgba(0,168,181,0.5); }
      50% { box-shadow: var(--shadow), 0 0 0 8px rgba(0,168,181,0); }
      100% { box-shadow: var(--shadow), 0 0 0 0 rgba(0,168,181,0); }
    }
    .phone.highlight {
      animation: highlight-pulse 0.8s ease;
    }

    /* Enlarge bottom sheet content in modal via scale on inner */
    .modal-content .bottom-sheet { padding: 10px 18px 20px; }
    .modal-content .sheet-title { font-size: 18px; }
    .modal-content .sheet-subtitle { font-size: 13px; }
    .modal-content .btn-primary { font-size: 16px; padding: 14px; }
    .modal-content .field-value { font-size: 15px; }
    .modal-content .metric-card .metric-text { font-size: 11px; }
    .modal-content .pickup-card-name { font-size: 14px; }
    .modal-content .detail-row { font-size: 12px; }
    .modal-content .status-card .sc-text { font-size: 10px; }
  </style>
</head>
<body>

<header class="page-header">
  <h1>Robotaxi Rain Mode</h1>
  <p>Interactive pickup flow demo — tap any screen to enlarge, or follow the primary buttons through the full journey.</p>
  <div class="flow-hint" aria-hidden="true">
    Flow: <span>1</span> → <span>2</span> → <span>3</span> → <span>4</span> → <span>5</span> → <span>6</span>
  </div>
</header>

<main class="demo-grid" id="demo-grid" role="list"></main>

<div class="modal-overlay" id="modal" role="dialog" aria-modal="true" aria-label="Screen preview">
  <button class="modal-close" id="modal-close" aria-label="Close preview">&times;</button>
  <div class="modal-content" id="modal-content"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  const SCREENS = [
    { id: 1, caption: 'Rain Mode Entry' },
    { id: 2, caption: 'Set Trip' },
    { id: 3, caption: 'Service Status' },
    { id: 4, caption: 'Pickup Options' },
    { id: 5, caption: 'Request Robotaxi' },
    { id: 6, caption: 'Walk to Pickup' }
  ];

  let selectedPickup = 'sheltered';
  let modalScreen = null;

  /* ── SVG Icons ── */
  const icons = {
    signal: `<svg width="15" height="10" viewBox="0 0 15 10"><rect x="0" y="6" width="2.5" height="4" rx="0.5" fill="#1c1c1e"/><rect x="3.5" y="4" width="2.5" height="6" rx="0.5" fill="#1c1c1e"/><rect x="7" y="2" width="2.5" height="8" rx="0.5" fill="#1c1c1e"/><rect x="10.5" y="0" width="2.5" height="10" rx="0.5" fill="#1c1c1e"/></svg>`,
    wifi: `<svg width="14" height="10" viewBox="0 0 14 10"><path d="M7 2.5C4.5 2.5 2.3 3.5.5 5.2l1 1.2C3 4.7 4.9 4 7 4s4 0.7 5.5 2.4l1-1.2C11.7 3.5 9.5 2.5 7 2.5zm0 3c-1.5 0-2.8.6-3.8 1.6l1 1.2c.7-.7 1.7-1.1 2.8-1.1s2.1.4 2.8 1.1l1-1.2C9.8 6.1 8.5 5.5 7 5.5zm0 3a1.5 1.5 0 100 3 1.5 1.5 0 000-3z" fill="#1c1c1e"/></svg>`,
    battery: `<svg width="22" height="10" viewBox="0 0 22 10"><rect x="0" y="1" width="18" height="8" rx="2" stroke="#1c1c1e" stroke-width="1" fill="none"/><rect x="1.5" y="2.5" width="13" height="5" rx="1" fill="#1c1c1e"/><path d="M19 3.5v3a1.5 1.5 0 000-3z" fill="#1c1c1e"/></svg>`,
    rainCloud: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 18h12a4 4 0 000-8 5 5 0 00-9.5-1.5A3.5 3.5 0 006 18z" fill="white" opacity="0.9"/><path d="M8 20v2M12 20v2M16 20v2" stroke="white" stroke-width="1.5" stroke-linecap="round"/></svg>`,
    profile: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" fill="#8e8e93"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" fill="#8e8e93"/></svg>`,
    more: `<svg width="14" height="14" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.5" fill="#8e8e93"/><circle cx="12" cy="12" r="1.5" fill="#8e8e93"/><circle cx="18" cy="12" r="1.5" fill="#8e8e93"/></svg>`,
    pinTeal: `<svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="#00a8b5"/><circle cx="12" cy="9" r="2.5" fill="white"/></svg>`,

    const positions = [[30,80],[60,120],[90,60],[140,100],[180,70],[210,130],[50,160],[120,180],[200,90],[240,150],[70,200],[160,40]];

      `<svg style="position:absolute;left:${x}px;top:${y}px;opacity:0.55" width="8" height="10" viewBox="0 0 8 10">${icons.dropBlue.replace('fill="#5ac8fa"','fill="#5ac8fa"')}</svg>`

  }

      const routeColor = selectedPickup === 'sheltered' ? '#34a853' : selectedPickup === 'closest' ? '#e53935' : '#f5a623';

    return `

  function buildGrid() {
    const grid = document.getElementById('demo-grid');
    grid.innerHTML = SCREENS.map(s => `
      <div class="phone-slot" data-screen-slot="${s.id}" tabindex="0" role="listitem" aria-label="Screen ${s.id}: ${s.caption}">
        ${renderScreen(s.id)}
        <div class="phone-caption"><span class="num">${s.id}.</span>${s.caption}</div>
      </div>
    `).join('');
    bindEvents(grid);
  }

  function refreshScreen(id) {
    const slot = document.querySelector(`[data-screen-slot="${id}"]`);
    if (slot) {
      const caption = slot.querySelector('.phone-caption').outerHTML;
      slot.innerHTML = renderScreen(id) + caption;
    }
    if (modalScreen === id) {
      openModal(id, false);
    }
  }

  function refreshAll() {
    SCREENS.forEach(s => refreshScreen(s.id));
    bindEvents(document.getElementById('demo-grid'));
    if (modalScreen) bindEvents(document.getElementById('modal-content'));
  }

  function navigateTo(nextId) {
    const slot = document.querySelector(`[data-screen-slot="${nextId}"]`);
    if (slot) {
      slot.scrollIntoView({ behavior: 'smooth', block: 'center' });
      const phone = slot.querySelector('.phone');
      phone.classList.remove('highlight');
      void phone.offsetWidth;
      phone.classList.add('highlight');
    }
    if (modalScreen) openModal(nextId, false);
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
  }

  function openModal(id, animate) {
    modalScreen = id;
    const modal = document.getElementById('modal');
    const content = document.getElementById('modal-content');
    const cap = SCREENS.find(s => s.id === id);
    content.innerHTML = `
      ${renderScreen(id)}
      <div class="modal-caption">${id}. ${cap.caption}</div>
      <div class="modal-nav">
        <button id="modal-prev" ${id <= 1 ? 'disabled' : ''}>← Previous</button>
        <button id="modal-next" ${id >= 6 ? 'disabled' : ''}>Next →</button>
      </div>
    `;
    if (animate !== false) modal.classList.add('open');
    bindEvents(content);
    document.getElementById('modal-prev')?.addEventListener('click', () => openModal(id - 1));
    document.getElementById('modal-next')?.addEventListener('click', () => openModal(id + 1));
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('open');
    modalScreen = null;
  }

  function handleAction(e) {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    e.stopPropagation();

    const action = btn.dataset.action;
    if (action === 'next') {
      const from = parseInt(btn.dataset.from, 10);
      navigateTo(from + 1);
    } else if (action === 'goto') {
      navigateTo(parseInt(btn.dataset.target, 10));
    } else if (action === 'toast') {
      showToast('Navigation started.');
    }
  }

  function handlePickup(e) {
    const card = e.target.closest('[data-pickup]');
    if (!card) return;
    e.stopPropagation();
    selectedPickup = card.dataset.pickup;
    refreshScreen(4);
    if (modalScreen === 4) openModal(4, false);
  }

  function bindEvents(root) {
    root.querySelectorAll('[data-action]').forEach(el => {
      el.removeEventListener('click', handleAction);
      el.addEventListener('click', handleAction);
    });
    root.querySelectorAll('[data-pickup]').forEach(el => {
      el.removeEventListener('click', handlePickup);
      el.addEventListener('click', handlePickup);
    });
  }

  document.getElementById('demo-grid').addEventListener('click', e => {
    if (e.target.closest('[data-action]') || e.target.closest('[data-pickup]') || e.target.closest('.back-btn')) return;
    const slot = e.target.closest('[data-screen-slot]');
    if (slot) openModal(parseInt(slot.dataset.screenSlot, 10));
  });

  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal').addEventListener('click', e => {
    if (e.target.id === 'modal') closeModal();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
    if (modalScreen && e.key === 'ArrowRight' && modalScreen < 6) openModal(modalScreen + 1);
    if (modalScreen && e.key === 'ArrowLeft' && modalScreen > 1) openModal(modalScreen - 1);
  });

  buildGrid();
})();
</script>
</body>
</html>
